# HTTPS local para probar desde el celular (la cámara del escáner QR solo funciona con conexión segura).
# Uso: docker compose -f docker-compose.yml -f docker-compose.https.yml up -d
# Requiere el certificado en certs/ (ver README-docker.md).
services:
  web:
    ports:
      - "${WEB_HTTPS_PORT:-443}:443"
    volumes:
      - ./nodus-frontend/nginx.https.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
