# Igual que nginx.conf, más HTTPS en el 443 con un certificado autofirmado.
# Solo para probar desde el celular en la red local (la cámara exige conexión segura):
# lo monta docker-compose.https.yml, ver README-docker.md.
server {
    listen 80;
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/nodus.crt;
    ssl_certificate_key /etc/nginx/certs/nodus.key;

    root /usr/share/nginx/html;
    index index.html;

    # Escaneos firmados de hasta 10 MB (AlmacenamientoService.TamanioMaximoEscaneo)
    client_max_body_size 12m;

    # Certificado público de la CA local, para instalarlo en el celular (solo este archivo, nunca las claves)
    location = /nodus-ca.crt {
        alias /etc/nginx/certs/nodus-ca.crt;
        default_type application/x-x509-ca-cert;
        # Si se regenera la CA, el celular tiene que bajar la nueva y no usar la de su caché
        add_header Cache-Control "no-store";
    }

    # React Router: cualquier ruta que no sea un archivo cae en index.html
    location / {
        try_files $uri /index.html;
    }

    # La barra final de proxy_pass quita el prefijo /api:
    # /api/api/prestamos -> http://api:8080/api/prestamos
    location /api/ {
        proxy_pass http://api:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
