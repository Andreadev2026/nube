server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Escaneos firmados de hasta 10 MB (AlmacenamientoService.TamanioMaximoEscaneo)
    client_max_body_size 12m;

    # React Router: cualquier ruta que no sea un archivo cae en index.html
    location / {
        try_files $uri /index.html;
    }

    # La barra final de proxy_pass quita el prefijo /api:
    # /api/api/prestamos -> http://api:8080/api/prestamos
    location /api/ {
        proxy_pass http://api:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
